# Render Blueprint — declares the whole CeView stack so it can be created in
# one pass from the Render dashboard ("New" -> "Blueprint", point at this
# repo). Optional convenience on top of the manual steps in
# docs/DEPLOY_RENDER.md; read that guide first, especially the free-tier
# caveats section, before deploying this.
#
# `sync: false` env vars are secrets Render will prompt for during blueprint
# creation instead of storing them in this file.

databases:
  - name: ceview-db
    databaseName: ceview
    user: ceview
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: ceview-spring-boot
    runtime: docker
    plan: free
    dockerfilePath: ./backend/spring-boot/Dockerfile
    dockerContext: ./backend/spring-boot
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # Render's fromDatabase connectionString is postgres://..., not the
      # jdbc:postgresql://... URL Spring Data expects — build
      # SPRING_DATASOURCE_URL manually from the database's host/port/name
      # shown on its Render dashboard page (see docs/DEPLOY_RENDER.md step 2).
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ceview-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ceview-db
          property: password
      - key: FASTAPI_SBERT_BASE_URL
        fromService:
          type: web
          name: ceview-fastapi-sbert
          property: hostport
      - key: FASTAPI_TRANSFORMER_BASE_URL
        fromService:
          type: web
          name: ceview-fastapi-transformer
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      - key: CEVIEW_ATTRIBUTION_IP_HASH_SALT
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Email verification / password reset. Free web services on Render block outbound SMTP
      # (ports 25/465/587), so mail goes out over Resend's HTTPS API. Set the key and a sender on
      # a domain verified in Resend (docs/DEPLOY_RENDER.md, "Email (Resend)").
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: ceview-fastapi-sbert
    runtime: docker
    plan: free
    dockerfilePath: ./backend/fastapi-sbert/Dockerfile
    dockerContext: ./backend/fastapi-sbert
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ceview-db
          property: connectionString

  - type: web
    name: ceview-fastapi-transformer
    runtime: docker
    plan: free
    dockerfilePath: ./backend/fastapi-transformer/Dockerfile
    dockerContext: ./backend/fastapi-transformer
    healthCheckPath: /healthz
    envVars:
      # bilstm = the HuggingFace Space forecaster; the default "stub" is a placeholder.
      - key: FORECAST_ENGINE
        value: bilstm
      # Google Trends for Market Radar; trend calls answer 503 without it.
      - key: SERPAPI_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      # Only read when FORECAST_ENGINE=groq.
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: ceview-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # SPA: serve index.html for client-side routes such as /enquiry.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The browser calls this, so it must be Spring Boot's PUBLIC https URL
      # (e.g. https://ceview-spring-boot-xxxx.onrender.com). fromService
      # hostport would give the private-network host:port, which a browser
      # can't reach.
      - key: VITE_API_BASE_URL
        sync: false
