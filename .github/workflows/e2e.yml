name: E2E (Playwright, full stack, per-screen)

on:
  push:
    branches: [main, task_allocation, ph1-dev]
  pull_request:
    branches: [main, task_allocation, ph1-dev]
  schedule:
    # Full, unfiltered run every night — the path-filtered PR checks below are
    # a fast-feedback convenience, not a substitute for this safety net.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  # Determines which screens' spec files actually need to run for a given PR.
  # Every leg of the `e2e` matrix below still always runs on push/schedule/
  # workflow_dispatch — this job's output only narrows what runs on
  # pull_request events. See docs/superpowers/plans/2026-08-10-ui-ux-overhaul-frontend/00-index.md
  # ("Testing strategy") for the reasoning.
  changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: none
          filters: |
            foundation:
              - 'frontend/styles/**'
              - 'frontend/layout/**'
              - 'frontend/services/**'
              - 'frontend/App.tsx'
              - 'frontend/types.ts'
              - 'e2e/tests/login.spec.ts'
              - 'backend/**'
            login:
              - 'frontend/components/auth/**'
              - 'e2e/tests/login.spec.ts'
            onboarding-wizard:
              - 'frontend/components/module-1/onboarding/**'
              - 'e2e/tests/onboarding-wizard.spec.ts'
            settings-business-profile:
              - 'frontend/components/module-1/settings/**'
              - 'e2e/tests/settings-business-profile.spec.ts'
            dashboard:
              - 'frontend/components/module-2/2.1-dashboard/**'
              - 'e2e/tests/dashboard.spec.ts'
            market-radar-drawer:
              - 'frontend/components/module-2/2.2-market-radar/**'
              - 'e2e/tests/market-radar-drawer.spec.ts'
            content-studio:
              - 'frontend/components/module-3/3.1-content-studio/**'
              - 'e2e/tests/content-studio.spec.ts'
            calendar:
              - 'frontend/components/module-3/calendar/**'
              - 'e2e/tests/calendar.spec.ts'
            settings-platforms:
              - 'frontend/components/module-3/settings/**'
              - 'e2e/tests/settings-platforms.spec.ts'
            settings-workspace:
              - 'frontend/components/shared/settings/**'
              - 'e2e/tests/settings-workspace.spec.ts'
            performance:
              - 'frontend/components/module-4/4.1-campaign-analytics/**'
              - 'e2e/tests/performance.spec.ts'

  e2e:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        screen:
          - login
          - onboarding-wizard
          - settings-business-profile
          - dashboard
          - market-radar-drawer
          - content-studio
          - calendar
          - settings-platforms
          - settings-workspace
          - performance
    # Runs unconditionally on push/schedule/workflow_dispatch (full safety-net
    # run). On pull_request, only runs when this screen's own paths changed or
    # a `foundation` path changed (shared infra can break any screen).
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON(needs.changes.outputs.changes), matrix.screen) ||
      contains(fromJSON(needs.changes.outputs.changes), 'foundation')
    runs-on: ubuntu-latest
    name: e2e-screen (${{ matrix.screen }})
    # See the original workflow's note: fastapi-sbert's cold-start HF model
    # download + docker-compose health-check gating can take 10+ minutes even
    # for a single screen's spec file, since the whole stack still has to boot.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Spring Boot jar
        working-directory: backend/spring-boot
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests

      - name: Start backend stack (Postgres + Spring Boot + FastAPI services)
        working-directory: backend
        env:
          # Repo secret — see docs/DEPLOY_RENDER.md and the repo README for
          # setup notes. fastapi-transformer hard-fails at startup without a
          # real key; a placeholder is enough to boot but forecasting calls
          # that actually reach Groq will fail, which most screen specs don't
          # exercise directly.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: docker compose up -d --build

      - name: Wait for backend health checks
        run: |
          echo "Waiting for spring-boot on :8080..."
          timeout 600 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 5; done'
          echo "Waiting for fastapi-sbert on :8000..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/healthz; do sleep 5; done'
          echo "Waiting for fastapi-transformer on :8001..."
          timeout 60 bash -c 'until curl -sf http://localhost:8001/healthz; do sleep 5; done'

      - name: Dump container logs on health-check failure
        if: failure()
        working-directory: backend
        run: |
          echo "::group::docker compose ps"
          docker compose ps
          echo "::endgroup::"
          for svc in postgres fastapi fastapi-transformer spring-boot; do
            echo "::group::logs: $svc"
            docker compose logs "$svc" || true
            echo "::endgroup::"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build and start frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: |
          npm ci
          npm run build
          npm run preview -- --port 3000 --host 0.0.0.0 &
          timeout 60 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests for this screen
        working-directory: e2e
        run: npx playwright test tests/${{ matrix.screen }}.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.screen }}
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down backend stack
        if: always()
        working-directory: backend
        run: docker compose down -v
