name: CI - fastapi-transformer

on:
  push:
    branches: [main, task_allocation, ph1-dev]
    paths:
      - 'backend/fastapi-transformer/**'
      - '.github/workflows/ci-fastapi-transformer.yml'
  pull_request:
    branches: [main, task_allocation, ph1-dev]
    paths:
      - 'backend/fastapi-transformer/**'
      - '.github/workflows/ci-fastapi-transformer.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/fastapi-transformer
    # Placeholder only — never used for a real API call. The Groq client in
    # gemini_forecaster.py is built lazily on first use, and tests/conftest.py
    # removes GROQ_API_KEY and forces FORECAST_ENGINE=stub for the suite.
    env:
      GROQ_API_KEY: test-placeholder-key-not-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/fastapi-transformer/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
