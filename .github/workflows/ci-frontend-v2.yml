name: CI - Frontend (v2)

on:
  push:
    branches: [main, ph1-dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend-v2.yml'
  pull_request:
    branches: [main, ph1-dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend-v2.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS — matches ci-frontend.yml's pin (see that workflow's
          # comment for why: some Node 20.x patch levels crash Vitest's
          # forked workers via a jsdom/undici incompatibility).
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
