name: Deploy - AWS

# Releases: fast-forward `release` to a commit on main that passed CI, then
#   git push origin origin/main:release
# The server polls /ceview/prod/release-sha (written last, by `publish`) and
# rolls out within ~2 minutes. docs/DEPLOY_AWS.md A1 and B10.

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [spring-boot, fastapi-sbert, fastapi-transformer]
    steps:
      - uses: actions/checkout@v4

      - name: Load deploy.env
        run: |
          if grep -q FILL_ME deploy/aws/deploy.env; then
            echo "::error::deploy/aws/deploy.env still has FILL_ME values"; exit 1
          fi
          grep -E '^[A-Z_]+=' deploy/aws/deploy.env >> "$GITHUB_ENV"

      # The sbert image (torch + sentence-transformers) needs more room than a
      # stock runner leaves free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.service }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/ceview/${{ matrix.service }}:${{ github.sha }}
          # No attestation manifests: they'd count as extra images against
          # the ECR "keep last 10" lifecycle rule.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load deploy.env
        run: |
          if grep -q FILL_ME deploy/aws/deploy.env; then
            echo "::error::deploy/aws/deploy.env still has FILL_ME values"; exit 1
          fi
          grep -E '^[A-Z_]+=' deploy/aws/deploy.env >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload release bundle
        run: |
          stage="$RUNNER_TEMP/bundle"
          cp -r deploy/aws "$stage"
          cp backend/spring-boot/src/main/resources/db/dump/uniqueness-corpus.sql "$stage/sql/"
          echo "IMAGE_TAG=${GITHUB_SHA}" > "$stage/release.env"
          aws s3 sync "$stage" "s3://${OPS_BUCKET}/releases/${GITHUB_SHA}/" --delete --only-show-errors
          aws s3 cp deploy/aws/scripts/bootstrap.sh "s3://${OPS_BUCKET}/bootstrap/bootstrap.sh" --only-show-errors

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load deploy.env
        run: |
          if grep -q FILL_ME deploy/aws/deploy.env; then
            echo "::error::deploy/aws/deploy.env still has FILL_ME values"; exit 1
          fi
          grep -E '^[A-Z_]+=' deploy/aws/deploy.env >> "$GITHUB_ENV"

      - name: Check frontend.production.env
        run: |
          f=deploy/aws/frontend.production.env
          if grep -q FILL_ME "$f"; then
            echo "::error::$f still has FILL_ME values"; exit 1
          fi
          if grep -Eiq '^VITE_USE_FIXTURES=(true|1)' "$f"; then
            echo "::error::VITE_USE_FIXTURES must not be enabled in a production build"; exit 1
          fi
          cp "$f" frontend/.env.production.local

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed assets are immutable and kept (no --delete), so a browser still
      # holding the previous index.html can load its chunks. index.html is
      # uploaded last and never cached, so it only points at files that exist.
      - name: Upload to S3 and invalidate
        working-directory: frontend/dist
        run: |
          aws s3 sync assets "s3://${SITE_BUCKET}/assets" --only-show-errors \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync . "s3://${SITE_BUCKET}" --only-show-errors --delete \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "public,max-age=300"
          aws s3 cp index.html "s3://${SITE_BUCKET}/index.html" --only-show-errors \
            --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/index.html" --query Invalidation.Id --output text

  publish:
    runs-on: ubuntu-latest
    needs: [images, bundle, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Load deploy.env
        run: grep -E '^[A-Z_]+=' deploy/aws/deploy.env >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish release-sha
        run: |
          aws ssm put-parameter --name /ceview/prod/release-sha --type String \
            --value "${GITHUB_SHA}" --overwrite
          echo "Released ${GITHUB_SHA}. The server picks it up within ~2 minutes."
