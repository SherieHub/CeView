name: CI - Frontend

on:
  push:
    branches: [main, task_allocation, ph1-dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main, task_allocation, ph1-dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS, not 20 — some Node 20.x patch levels resolved by
          # setup-node have a jsdom/undici incompatibility that crashes
          # Vitest's forked workers with "webidl.util.markAsUncloneable is
          # not a function" (thrown from undici's CacheStorage, required
          # transitively by jsdom). Node 22 doesn't hit this.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
