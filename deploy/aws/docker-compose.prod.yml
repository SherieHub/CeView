# Production stack for the single Lightsail server (docs/DEPLOY_AWS.md A1).
# Always run it through `ceview-compose`, which supplies the three env files
# this file interpolates from:
#   deploy.env        AWS_REGION, AWS_ACCOUNT_ID, DOMAIN, ...   (non-secret, in the bundle)
#   release.env       IMAGE_TAG=<git sha>                        (written by the workflow)
#   /opt/ceview/.env  secrets from SSM /ceview/prod/*            (fetch-secrets.sh, mode 600)
#
# Only caddy publishes ports. Postgres and both FastAPI services have no auth
# of their own and are reachable only on this project's Docker network.

name: ceview

x-logging: &awslogs
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION}
    awslogs-group: /ceview/prod
    awslogs-create-group: "true"
    tag: "{{.Name}}"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 64m
    logging: *awslogs

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from Parameter Store}
      POSTGRES_DB: postgres
      # Read only by postgres-init on the very first start (empty data dir).
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD missing from Parameter Store}
    volumes:
      - /data/pgdata:/var/lib/postgresql/data
      # Absolute path through the `current` symlink, not ./, so the mount
      # string stays the same across releases and a deploy doesn't restart
      # the database.
      - /opt/ceview/current/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceview -d ceview"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *awslogs

  fastapi-sbert:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/ceview/fastapi-sbert:${IMAGE_TAG:?IMAGE_TAG missing}
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OMCS_VISION_MODEL: ${OMCS_VISION_MODEL:-qwen/qwen3.8-27b}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_SPACE_ID: ${HF_SPACE_ID:-JamJamzz/ceview_sbert}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      DATABASE_URL: postgresql://ceview:${DB_APP_PASSWORD}@postgres:5432/ceview
      ENABLE_WANDB: "false"
      PRELOAD_E5_ENCODER: "true"
    volumes:
      # The 1.1GB E5 encoder is downloaded once and survives restarts/releases.
      - /data/hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 600s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2200m
    logging: *awslogs

  fastapi-transformer:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/ceview/fastapi-transformer:${IMAGE_TAG:?IMAGE_TAG missing}
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      FORECAST_ENGINE: bilstm
      HF_TOKEN: ${HF_TOKEN:-}
      ENABLE_WANDB: "false"
    mem_limit: 600m
    logging: *awslogs

  spring-boot:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/ceview/spring-boot:${IMAGE_TAG:?IMAGE_TAG missing}
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ceview
      SPRING_DATASOURCE_USERNAME: ceview
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD}
      FASTAPI_SBERT_BASE_URL: http://fastapi-sbert:8000
      FASTAPI_TRANSFORMER_BASE_URL: http://fastapi-transformer:8001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing from Parameter Store}
      CEVIEW_ATTRIBUTION_IP_HASH_SALT: ${CEVIEW_ATTRIBUTION_IP_HASH_SALT:?CEVIEW_ATTRIBUTION_IP_HASH_SALT missing from Parameter Store}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      # Email verification / password reset codes, sent through Resend's HTTPS API.
      # EMAIL_PROVIDER is required (no default) on purpose: with the 'log' fallback no
      # email is sent and the codes only land in CloudWatch, so nobody could verify.
      # A missing parameter fails this deploy's health check and rolls back instead.
      # Never set CEVIEW_TEST_SUPPORT_ENABLED here (Spring refuses it alongside Resend).
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER missing from Parameter Store (set it to resend)}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # URLs derived from DOMAIN (deploy.env).
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      FRONTEND_BASE_URL: https://${DOMAIN}
      CEVIEW_ATTRIBUTION_BASE_URL: https://api.${DOMAIN}
      OAUTH_REDIRECT_BASE_URL: https://api.${DOMAIN}
      # Caddy is the only proxy in front; Tomcat trusts Docker's private range,
      # so rate limiting and click hashing see the real client IP.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      INGESTION_ENABLED: "true"
      CEVIEW_INGESTION_ADMIN_TRIGGER_ENABLED: "false"
      # Add /ceview/prod/MODULE2_MARKETS in Parameter Store to override.
      MODULE2_MARKETS: ${MODULE2_MARKETS:-korea,japan,usa}
    # Deliberately not waiting on fastapi-sbert: its first start can spend
    # minutes downloading E5, and Spring degrades gracefully meanwhile.
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 900m
    logging: *awslogs

volumes:
  caddy-data:
  caddy-config:
