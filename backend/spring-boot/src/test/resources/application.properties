# ── H2 in-memory database — no PostgreSQL needed ────────────────────────────
spring.datasource.url=jdbc:h2:mem:ceviewtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tests generate the schema directly from the JPA entities rather than the
# hand-maintained db/h2 Flyway mirror, which has drifted from the Postgres
# migrations (missing columns like weekly_forecasts_json, renumbered versions).
# create-drop keeps the test schema in lock-step with the entities and removes
# the mirror as a maintenance burden. The pgvector embedding table is not a JPA
# entity (FastAPI owns it), so nothing here needs pgvector.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Flyway disabled for tests — Hibernate (create-drop above) owns the schema.
spring.flyway.enabled=false

# Stub URLs — all external HTTP is mocked in tests
ceview.fastapi.sbert.base-url=http://localhost:8000
ceview.fastapi.transformer.base-url=http://localhost:8001
ceview.fastapi.timeout-seconds=5
ceview.fastapi.rank-markets-timeout-seconds=10
ceview.external.worldbank.base-url=http://localhost:9999
ceview.external.forex.base-url=http://localhost:9999

# Disable the scheduled ingestion job so it doesn't interfere with tests
ceview.ingestion.enabled=false

# Minimal JWT + CORS for context startup
ceview.jwt.secret=test-secret-key-minimum-32-characters-here!!
ceview.jwt.expiry-hours=24
ceview.cors.allowed-origins=http://localhost:5173,http://localhost:3001,http://localhost:3002
