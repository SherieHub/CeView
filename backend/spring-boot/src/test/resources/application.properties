# ── H2 in-memory database — no PostgreSQL needed ────────────────────────────
spring.datasource.url=jdbc:h2:mem:ceviewtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Use the H2-compatible migration scripts
spring.flyway.locations=classpath:db/h2
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Stub URLs — all external HTTP is mocked in tests
ceview.fastapi.sbert.base-url=http://localhost:8000
ceview.fastapi.transformer.base-url=http://localhost:8001
ceview.fastapi.timeout-seconds=5
ceview.fastapi.rank-markets-timeout-seconds=10
ceview.external.worldbank.base-url=http://localhost:9999
ceview.external.forex.base-url=http://localhost:9999

# Disable the scheduled ingestion job so it doesn't interfere with tests
ceview.ingestion.enabled=false

# Minimal JWT + CORS for context startup
ceview.jwt.secret=test-secret-key-minimum-32-characters-here!!
ceview.jwt.expiry-hours=24
ceview.cors.allowed-origins=http://localhost:5173
