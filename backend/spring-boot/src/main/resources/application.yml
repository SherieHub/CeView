server:
  port: 8080

spring:
  application:
    name: ceview-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ceview}
    username: ${SPRING_DATASOURCE_USERNAME:ceview}
    password: ${SPRING_DATASOURCE_PASSWORD:ceview}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

ceview:
  fastapi:
    # fastapi-sbert — Modules 1, 3, 4 (SBERT / Gemini NLP stack, port 8000)
    sbert:
      base-url: ${FASTAPI_SBERT_BASE_URL:http://localhost:8000}
    # fastapi-transformer — Module 2 (Gemini demand forecasting + XGBoost economic scoring, port 8001)
    transformer:
      base-url: ${FASTAPI_TRANSFORMER_BASE_URL:http://localhost:8001}
    timeout-seconds: 30
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32chars-min}
    expiry-hours: 24
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  external:
    worldbank:
      base-url: ${WORLDBANK_BASE_URL:https://api.worldbank.org/v2}
    forex:
      base-url: ${FOREX_BASE_URL:https://api.exchangerate.host}
  ingestion:
    enabled: ${INGESTION_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
