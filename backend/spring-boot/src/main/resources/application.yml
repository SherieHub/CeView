server:
  port: 8080
  # Behind Render's proxy request.getRemoteAddr() is the proxy, not the client; honouring
  # X-Forwarded-For lets the per-IP rate limiters (auth email, attribution enquiries) tell
  # clients apart instead of putting everyone in one bucket.
  forward-headers-strategy: framework

spring:
  application:
    name: ceview-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ceview}
    username: ${SPRING_DATASOURCE_USERNAME:ceview}
    password: ${SPRING_DATASOURCE_PASSWORD:ceview}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

ceview:
  module2:
    markets: ${MODULE2_MARKETS:korea,japan,usa}
  fastapi:
    # fastapi-sbert — Modules 1, 3, 4 (SBERT / Gemini NLP stack, port 8000)
    sbert:
      base-url: ${FASTAPI_SBERT_BASE_URL:http://localhost:8000}
    # fastapi-transformer — Module 2 (Gemini demand forecasting + XGBoost economic scoring, port 8001)
    transformer:
      base-url: ${FASTAPI_TRANSFORMER_BASE_URL:http://localhost:8001}
    timeout-seconds: 90
    # rank-markets calls PyTrends live (6 batches × 4–12 s jitter = up to 75 s).
    # This separate timeout prevents the shared 30 s limit from killing live fetches.
    rank-markets-timeout-seconds: 90
  jwt:
    # No default outside the h2 profile: startup fails if unset (issue #51,
    # see config/RequiredSecretsEnvironmentPostProcessor).
    secret: ${JWT_SECRET:}
    expiry-hours: 24
  email:
    # 'log' prints the code to the backend log and sends nothing (local dev, e2e, seeded
    # @ceview.local operators). 'resend' sends through Resend's HTTPS API — SMTP is not an option
    # on Render's free tier, which blocks outbound ports 25/465/587.
    provider: ${EMAIL_PROVIDER:log}
    # Must be an address on a domain verified in Resend, e.g. CeView <no-reply@yourdomain.com>.
    from: ${EMAIL_FROM:}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: https://api.resend.com
  email-code:
    ttl: 10m
    max-attempts: 5
    resend-cooldown: 60s
    max-sends-per-hour: 5
  # Per-IP cap on the auth endpoints that send email (protects Resend's 100/day free quota).
  auth-rate-limit:
    # Overridable because an e2e run registers far more than 10 accounts from one IP.
    max-requests: ${CEVIEW_AUTH_RATE_LIMIT_MAX_REQUESTS:10}
    window: 15m
  # Separate per-IP cap on register / complete-profile, the endpoints that carry phone
  # verification (AuthRateLimiter). Takes the same e2e override as the email cap above.
  auth:
    rate-limit:
      max-requests: ${CEVIEW_AUTH_RATE_LIMIT_MAX_REQUESTS:20}
      window-seconds: 900
  test-support:
    # E2E only: exposes /api/test-support/email-codes/latest. Never enable with a real provider.
    enabled: ${CEVIEW_TEST_SUPPORT_ENABLED:false}
  attribution:
    # Public origin the redirect is served from. This string is embedded in live ads.
    # Falls back to RENDER_EXTERNAL_URL, which Render injects into every web service, so a deploy that
    # forgets the variable still gets working public links instead of localhost ones.
    base-url: ${CEVIEW_ATTRIBUTION_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
    # Frontend origin that serves the hosted booking-enquiry form (/enquiry). Hosted tracked links
    # redirect here; it is the frontend, not the API, so it follows FRONTEND_BASE_URL by default.
    enquiry-base-url: ${CEVIEW_ENQUIRY_BASE_URL:${FRONTEND_BASE_URL:http://localhost:3001}}
    # Salt for hashing traveller IPs. Same rule as the JWT secret above.
    ip-hash-salt: ${CEVIEW_ATTRIBUTION_IP_HASH_SALT:}
  firebase:
    # Full service-account JSON as a single env var value (not a mounted file path) —
    # matches how other secrets (e.g. GROQ_API_KEY) are handled. Left blank in local/test
    # environments that don't need Google sign-in; the Firebase beans are conditional on
    # this being set, so the app still starts without it (see FirebaseConfig).
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  security:
    # Base64-encoded 256-bit key encrypting third-party ad-platform OAuth tokens
    # at rest (see common/crypto/TokenCipher). Blank in environments that don't
    # connect ad accounts — the ad-connection endpoints then return 503 rather
    # than the app failing to start. Generate with: openssl rand -base64 32
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  adplatform:
    # Public HTTPS origin the platforms redirect back to. In local dev this is a
    # tunnel (ngrok/cloudflared) pointing at :8080 — see AD_PLATFORM_SETUP.md.
    # It must match the redirect URI registered in each platform's app settings
    # exactly, including scheme and absence of a trailing slash.
    redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:}
    # Where the callback sends the browser after storing the grant.
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    meta:
      app-id: ${META_APP_ID:}
      app-secret: ${META_APP_SECRET:}
      graph-base-url: ${META_GRAPH_BASE_URL:https://graph.facebook.com/v25.0}
      dialog-url: ${META_DIALOG_URL:https://www.facebook.com/v25.0/dialog/oauth}
    tiktok:
      app-id: ${TIKTOK_APP_ID:}
      app-secret: ${TIKTOK_APP_SECRET:}
  social:
    dispatch-enabled: ${SOCIAL_DISPATCH_ENABLED:true}
    dispatch-delay-ms: ${SOCIAL_DISPATCH_DELAY_MS:30000}
    metrics-enabled: ${SOCIAL_METRICS_ENABLED:true}
    metrics-cron: ${SOCIAL_METRICS_CRON:0 0 3 * * *}
    tiktok:
      # TikTok for Developers app (Login Kit + Content Posting API) — NOT the TikTok For Business
      # ads app above. Blank = the TikTok publishing connection reports "not configured".
      client-key: ${TIKTOK_CONTENT_CLIENT_KEY:}
      client-secret: ${TIKTOK_CONTENT_CLIENT_SECRET:}
  media:
    # "s3" in production (compose sets it); "local" keeps uploads on disk for dev and tests.
    storage: ${MEDIA_STORAGE:local}
    # Origin that serves uploaded files. Platforms fetch media from here, so it must be
    # public HTTPS in production (TikTok additionally verifies this URL prefix).
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
    local-dir: ${MEDIA_LOCAL_DIR:./media-uploads}
    s3:
      bucket: ${MEDIA_BUCKET:}
      region: ${MEDIA_AWS_REGION:ap-southeast-1}
      # Blank = fall back to the SDK's default credential chain (env, ~/.aws).
      access-key-id: ${MEDIA_AWS_ACCESS_KEY_ID:}
      secret-access-key: ${MEDIA_AWS_SECRET_ACCESS_KEY:}
      presign-minutes: ${MEDIA_PRESIGN_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3001,http://localhost:3002}
  external:
    worldbank:
      base-url: ${WORLDBANK_BASE_URL:https://api.worldbank.org/v2}
    forex:
      base-url: ${FOREX_BASE_URL:https://api.frankfurter.dev}
      cdn-base: ${FOREX_CDN_BASE:https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@}
  ingestion:
    enabled: ${INGESTION_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
