server:
  port: 8080

spring:
  application:
    name: ceview-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ceview}
    username: ${SPRING_DATASOURCE_USERNAME:ceview}
    password: ${SPRING_DATASOURCE_PASSWORD:ceview}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

ceview:
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
    timeout-seconds: 30
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32chars-min}
    expiry-hours: 24
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
