[project]
name = "ceview-fastapi-transformer"
version = "0.2.0"
description = "CeView Transformer microservice — Module 2 demand forecasting & market intelligence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    # Module 2 — market scoring
    "xgboost>=2.0.0",
    "numpy>=1.26.0,<2.0",
    # Groq API (OpenAI-compatible) — demand forecasting (FORECAST_ENGINE=groq)
    "openai>=1.0.0",
    # BiLSTM + Transformer demand model hosted on Hugging Face Spaces (FORECAST_ENGINE=bilstm)
    "gradio_client>=2.0.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["models", ".venv"]

[tool.ruff.lint]
# Explicit so results don't change between ruff versions: pycodestyle errors, pyflakes, isort.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before the app modules import and read os.environ.
"app/main.py" = ["E402"]
