services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ceview-postgres
    environment:
      POSTGRES_DB: ceview
      POSTGRES_USER: ceview
      POSTGRES_PASSWORD: ceview
    ports:
      - "5433:5432"
    volumes:
      - ceview-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceview -d ceview"]
      interval: 5s
      timeout: 3s
      retries: 10

  fastapi:
    build: ./fastapi-sbert
    container_name: ceview-fastapi
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      KERAS_MODEL_PATH: /app/models/complete_classifier_head.keras
      # Direct DB access for tbl_business_embedding reads/writes (Module 1 corpus)
      DATABASE_URL: postgresql://ceview:ceview@postgres:5432/ceview
    volumes:
      - ./fastapi-sbert/models:/app/models:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  fastapi-transformer:
    build: ./fastapi-transformer
    container_name: ceview-fastapi-transformer
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8001:8001"

  fastapi-compliance:
    build: ./fastapi-compliance
    container_name: ceview-fastapi-compliance
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  spring-boot:
    build: ./spring-boot
    container_name: ceview-spring
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ceview
      SPRING_DATASOURCE_USERNAME: ceview
      SPRING_DATASOURCE_PASSWORD: ceview
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      FASTAPI_BASE_URL: http://fastapi:8000
      FASTAPI_SBERT_BASE_URL: http://fastapi:8000
      FASTAPI_TRANSFORMER_BASE_URL: http://fastapi-transformer:8001
      FASTAPI_COMPLIANCE_BASE_URL: http://fastapi-compliance:8002
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32chars-min}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://192.168.1.194:3000,http://192.168.1.194:5173
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_healthy
      fastapi-transformer:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  ceview-pgdata:
