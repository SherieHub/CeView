services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ceview-postgres
    environment:
      POSTGRES_DB: ceview
      POSTGRES_USER: ceview
      POSTGRES_PASSWORD: ceview
    ports:
      - "5433:5432"
    volumes:
      - ceview-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceview -d ceview"]
      interval: 5s
      timeout: 3s
      retries: 10

  fastapi:
    build: ./fastapi-sbert
    container_name: ceview-fastapi
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Groq decommissions models periodically; override without a rebuild.
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      # The compliance audit needs an image-capable model (omcs_agent/node.py).
      OMCS_VISION_MODEL: ${OMCS_VISION_MODEL:-qwen/qwen3.8-27b}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_SPACE_ID: ${HF_SPACE_ID:-JamJamzz/ceview_sbert}
      # Direct DB access for tbl_business_embedding reads/writes (Module 1 corpus)
      DATABASE_URL: postgresql://ceview:ceview@postgres:5432/ceview
    volumes:
      # Persist the HuggingFace cache so the ~1.1GB E5 encoder is downloaded
      # once and reused across rebuilds/recreates instead of every startup.
      - ceview-hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    # The lifespan hook downloads + loads the E5 encoder before /healthz serves.
    # A cold download can take several minutes, so give it a long start_period;
    # failures during this window don't count against the container.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 600s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  fastapi-transformer:
    build: ./fastapi-transformer
    container_name: ceview-fastapi-transformer
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Groq decommissions models periodically; override without a rebuild.
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      # SerpApi's Google Trends engine — trend_service.py raises
      # DependencyUnavailable (503) when this is unset. Without this line the
      # key sits in backend/.env for compose variable substitution only and
      # never actually reaches the container's process environment.
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      # forecast_engine.py resolves this once at process startup and defaults
      # to "stub" (the naive placeholder) when unset. Without this line here
      # the value sitting in backend/.env never reaches the container, same
      # issue as SERPAPI_KEY above.
      FORECAST_ENGINE: ${FORECAST_ENGINE:-stub}
      # Only read by the bilstm engine (Hugging Face Space client) — harmless
      # while FORECAST_ENGINE=stub.
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8001:8001"

  spring-boot:
    build: ./spring-boot
    container_name: ceview-spring
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ceview
      SPRING_DATASOURCE_USERNAME: ceview
      SPRING_DATASOURCE_PASSWORD: ceview
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      FASTAPI_SBERT_BASE_URL: http://fastapi:8000
      FASTAPI_TRANSFORMER_BASE_URL: http://fastapi-transformer:8001
      # Both required, no default: this stack runs the Postgres profile, which
      # refuses to start without real values (issue #51). Set them in backend/.env.
      JWT_SECRET: ${JWT_SECRET:-}
      CEVIEW_ATTRIBUTION_IP_HASH_SALT: ${CEVIEW_ATTRIBUTION_IP_HASH_SALT:-}
      # :3012 is the dedicated port e2e/playwright.config.ts's webServer boots
      # the frontend on, specifically so an e2e run never shares a developer's
      # fixture-mode Vite server on :3001 — without it here every e2e request
      # fails CORS preflight (403 "Invalid CORS request") before reaching the
      # app, e.g. registration in onboarding-uniqueness.spec.ts.
      # Overridable from backend/.env; if you do, keep :3012 in the list.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:3001,http://localhost:3002,http://localhost:3012,http://192.168.1.194:3000,http://192.168.1.194:5173}
      # Public origin baked into /r/{slug} attribution links.
      CEVIEW_ATTRIBUTION_BASE_URL: ${CEVIEW_ATTRIBUTION_BASE_URL:-http://localhost:8080}
      # Nightly market-data refresh; each run spends SerpApi searches. false stops it.
      INGESTION_ENABLED: ${INGESTION_ENABLED:-true}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      # Email verification. 'log' (default) prints each 6-digit code to this container's log
      # (`docker compose logs spring-boot`) and sends nothing; set EMAIL_PROVIDER=resend with
      # RESEND_API_KEY + EMAIL_FROM to send real mail. See RUNNING.md.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # E2E only (set by .github/workflows/e2e.yml, or in backend/.env to run Playwright locally):
      # exposes /api/test-support/email-codes/latest so the suite can read codes. The backend
      # refuses to start with this on and EMAIL_PROVIDER=resend.
      CEVIEW_TEST_SUPPORT_ENABLED: ${CEVIEW_TEST_SUPPORT_ENABLED:-false}
      CEVIEW_AUTH_RATE_LIMIT_MAX_REQUESTS: ${CEVIEW_AUTH_RATE_LIMIT_MAX_REQUESTS:-10}
      # Ad-platform (Meta Ads / TikTok Ads) connections — see AD_PLATFORM_SETUP.md.
      # All optional: absent, the /api/ad-connections endpoints just report
      # "not configured on this server" rather than failing to start.
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      # Public HTTPS origin the platforms redirect back to. In local dev this
      # is a native `cloudflared tunnel --url http://localhost:8080` (or
      # ngrok) run in its own terminal, NOT a container — see
      # AD_PLATFORM_SETUP.md §4. It mints a new URL every time you restart
      # it, so update this + the redirect URI registered with Meta/TikTok
      # (§5) each session.
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_healthy
      fastapi-transformer:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  ceview-pgdata:
  ceview-hf-cache:
